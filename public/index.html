<script>

function closeM(id){document.getElementById(id).classList.remove('show')}function addItem(){const ts=[...document.querySelectorAll('#tops input:checked')].map(x=>({name:x.value,p:Number(x.dataset.p)}));cart.push({...current,sweet:document.querySelector('input[name=sweetOpt]:checked').value,ice:document.querySelector('input[name=iceOpt]:checked').value,tops:ts});closeM('itemModal');update()}
function total(){return cart.reduce((a,x)=>a+x.price+x.tops.reduce((s,t)=>s+t.p,0),0)}function update(){document.getElementById('count').textContent=cart.length;document.getElementById('total').textContent=total()}
function openCart(){renderCart();document.getElementById('cartModal').classList.add('show')}function renderCart(){document.getElementById('cart').innerHTML=cart.length?cart.map((x,i)=>'<div class="item"><div><b>'+x.name+'</b><div class="sub">'+x.sweet+'｜'+x.ice+(x.tops.length?'｜加料：'+x.tops.map(t=>t.name).join('、'):'')+'</div></div><div>$'+(x.price+x.tops.reduce((a,t)=>a+t.p,0))+'<br><button onclick="del('+i+')">刪除</button></div></div>').join(''):'<div class="empty-cart">購物車目前是空的<br><span class="note">選一杯喜歡的茶開始吧。</span></div>';document.getElementById('cartTotal').textContent=total()}
function del(i){cart.splice(i,1);update();renderCart()}function checkout(){if(!cart.length)return alert('購物車是空的');closeM('cartModal');document.getElementById('checkoutTotal').textContent=total();toggleMethod();document.getElementById('checkoutModal').classList.add('show')}
function toggleMethod(){const m=document.querySelector('input[name=method]:checked')?.value||'自取';const delivery=m==='外送';document.getElementById('addressLabel').classList.toggle('hidden',!delivery);document.getElementById('deliveryHint').classList.toggle('hidden',!delivery);document.getElementById('timeLabel').childNodes[0].nodeValue=delivery?'希望送達時間':'自取時間';}
async function submitOrder(){const method=document.querySelector('input[name=method]:checked')?.value||'自取';const payload={name:document.getElementById('name').value.trim(),phone:document.getElementById('phone').value.trim(),pickup:document.getElementById('time').value,address:document.getElementById('address').value.trim(),method,remark:document.getElementById('remark').value,items:cart,total:total()};if(!payload.name||!payload.phone||!payload.pickup)return alert('請完整填寫姓名、電話與時間');if(method==='外送'&&payload.total<200)return alert('外送訂單需滿 $200');if(method==='外送'&&!payload.address)return alert('請填寫完整外送地址');const r=await fetch('/api/orders',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload)});if(!r.ok){let msg='送單失敗，請再試一次';try{const e=await r.json();if(e.error)msg=e.error}catch(e){}return alert(msg)}const o=await r.json();trackingId=o.id;document.getElementById('statusId').textContent='訂單編號：'+o.id+'｜'+o.method;closeM('checkoutModal');document.getElementById('successModal').classList.add('show');cart=[];update();}
if (typeof io === 'function') {
  const socket=io();
  socket.on('order-updated',o=>{if(o.id===trackingId)renderStatus(o.status)});
  socket.on('new-order',()=>{});
}
function renderStatus(st){const map={new:['🔔 新訂單','snew'],accepted:['👋 已接單','saccepted'],making:['🥤 製作中','smaking'],done:['✅ 已完成','sdone']};const [t,id]=map[st]||map.new;document.getElementById('statusTitle').textContent=t;['snew','saccepted','smaking','sdone'].forEach(x=>document.getElementById(x).classList.toggle('on',x===id||(['snew','saccepted','smaking','sdone'].indexOf(x)<=['snew','saccepted','smaking','sdone'].indexOf(id))));}

async function returnToLine(){
  try{
    if (window.liff && liff.isInClient()){
      liff.closeWindow();
      return;
    }
  }catch(e){}
  alert('訂單已完成。若目前不是在 LINE App 內開啟，請回到官方 LINE。');
}
</script></body></html>
