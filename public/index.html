<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>一品現泡茶｜新生南店｜線上點餐</title>
  <style>
    :root{
      --deep:#0b3022; --green:#123f2d; --gold:#b89a5b;
      --paper:#fffdf8; --cream:#f6f0e3; --ink:#243029;
      --muted:#7b817c; --line:#e4ded1;
    }
    *{box-sizing:border-box}
    html,body{margin:0;width:100%;max-width:100%;overflow-x:hidden}
    body{
      color:var(--ink);
      background:linear-gradient(180deg,#f8f4eb 0,#fff 320px);
      font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","PingFang TC","Microsoft JhengHei",sans-serif;
    }
    button,input,textarea{font:inherit}
    button{cursor:pointer}
    header{
      position:sticky;top:0;z-index:50;
      background:rgba(255,253,248,.97);
      backdrop-filter:blur(10px);
      box-shadow:0 4px 18px rgba(34,49,40,.08)
    }
    .info{
      background:var(--deep);color:#f8f1df;
      display:flex;gap:18px;overflow-x:auto;
      padding:7px 10px;font-size:11px;font-weight:800;white-space:nowrap
    }
    .brand-wrap{padding:12px 14px 10px;text-align:center}
    .brand{
      font-family:"Noto Serif TC","PMingLiU",serif;
      font-size:28px;font-weight:900;letter-spacing:6px;color:var(--deep)
    }
    .brand-en{font-size:9px;letter-spacing:4px;color:var(--gold);font-weight:800}
    .slogan{font-size:11px;letter-spacing:2px;color:#566158;margin-top:5px}
    .hero{
      margin:0 10px 9px;padding:10px 12px;
      border:1px solid #dfd2b8;border-radius:8px;
      background:linear-gradient(110deg,#f4ead6,#fffaf0 50%,#eef3ec);
      display:flex;justify-content:space-between;gap:10px;align-items:center
    }
    .hero strong{color:var(--deep);font-family:"Noto Serif TC","PMingLiU",serif}
    .hero small{color:#7e735f}
    nav{
      display:flex;overflow-x:auto;scrollbar-width:none;
      border-top:1px solid #eee8dc;border-bottom:1px solid #dcd5c8;
      background:#fffdf8;padding:0 4px
    }
    nav::-webkit-scrollbar{display:none}
    nav button{
      flex:0 0 auto;border:0;background:transparent;padding:11px 12px;
      font-size:12px;font-weight:900;color:#687169
    }
    nav button.active{color:var(--deep);border-bottom:2px solid var(--gold)}
    main{padding:12px 10px 110px}
    .section-head{
      display:flex;justify-content:space-between;align-items:flex-start;
      gap:8px;padding:4px 0 10px;border-bottom:1px solid #cfc6b4
    }
    .section-title-wrap{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
    .section-head h2{
      margin:0;font-family:"Noto Serif TC","PMingLiU",serif;
      color:var(--deep);font-size:21px;letter-spacing:2px
    }
    .section-note{
      display:inline-flex;align-items:center;padding:5px 8px;
      border:1px solid #d8c7a1;background:#fff8e9;color:#765f2f;
      border-radius:999px;font-size:10px;font-weight:900
    }
    .section-head>span{font-size:10px;color:#999;padding-top:7px}
    .menu-grid{display:grid;grid-template-columns:1fr;gap:0}
    .card{
      display:grid;grid-template-columns:minmax(0,1fr) 44px 42px;
      align-items:center;gap:6px;padding:12px 2px;
      border-bottom:1px dashed #d8d1c4
    }
    .name{font-size:14px;font-weight:900;line-height:1.45}
    .price{font-weight:900;color:var(--deep);text-align:right}
    .add{
      width:34px;height:34px;border-radius:50%;
      border:1px solid #a9b9ad;background:#fff;color:var(--deep);font-size:20px
    }
    .bar{
      position:fixed;left:0;right:0;bottom:0;z-index:80;
      background:rgba(11,48,34,.98);color:#fff;
      padding:9px 10px calc(9px + env(safe-area-inset-bottom));
      display:flex;justify-content:space-between;align-items:center;gap:8px
    }
    .bar b{color:#f2ddb0;font-size:17px}
    .bar button{
      border:1px solid #e4d0a6;background:#f8f1e1;color:var(--deep);
      border-radius:7px;padding:10px 13px;font-weight:900
    }
    .overlay{
      display:none;position:fixed;inset:0;z-index:100;
      background:rgba(5,24,16,.62);align-items:flex-end
    }
    .overlay.show{display:flex}
    .sheet{
      width:100vw;max-width:100vw;max-height:calc(100dvh - 6px);
      overflow-y:auto;overflow-x:hidden;
      background:var(--paper);border-radius:18px 18px 0 0;
      border-top:3px solid var(--gold);
      padding:18px 14px calc(24px + env(safe-area-inset-bottom))
    }
    .sheet h2{margin:0;color:var(--deep);font-size:22px}
    .opt{margin:17px 0}
    .opt>b{display:block;margin-bottom:8px;color:var(--deep)}
    .choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:7px}
    .choices label{
      border:1px solid var(--line);padding:10px 8px;border-radius:7px;
      background:#fff;font-size:12px;line-height:1.35
    }
    .choices label:has(input:checked){border-color:var(--deep);background:#edf2ee;font-weight:900}
    input{accent-color:var(--deep)}
    .actions{
      display:flex;gap:8px;position:sticky;bottom:-1px;
      background:var(--paper);padding-top:9px;margin-top:16px
    }
    .actions button{
      flex:1;border:0;border-radius:7px;padding:12px;font-weight:900;min-height:46px
    }
    .primary{background:var(--deep);color:#fff}
    .secondary{background:#eee9df;color:#515b54}
    .item{
      display:flex;justify-content:space-between;gap:10px;
      border-bottom:1px solid var(--line);padding:12px 0
    }
    .sub{font-size:12px;color:var(--muted);line-height:1.6;margin-top:3px}
    .empty{padding:24px 0;text-align:center;color:var(--muted)}
    .total{text-align:right;color:var(--deep);font-size:20px;font-weight:950;margin-top:14px}
    .fulfillment{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin:14px 0}
    .fulfillment label{
      position:relative;border:1px solid var(--line);padding:11px 6px;
      border-radius:8px;text-align:center;font-size:13px;font-weight:900
    }
    .fulfillment label:has(input:checked){border-color:var(--deep);background:#edf2ee}
    .fulfillment input{position:absolute;opacity:0}
    .delivery-note{
      background:#fbf6eb;border:1px solid #e3d5b8;border-radius:7px;
      padding:9px 10px;font-size:11px;line-height:1.6;color:#7c6c4d
    }
    .form label{display:block;font-size:13px;font-weight:900;margin:10px 0}
    .form input,.form textarea{
      width:100%;margin-top:5px;padding:12px 10px;border:1px solid var(--line);
      border-radius:7px;background:#fff;font-size:16px
    }
    .hidden{display:none!important}
    .status{
      margin-top:14px;padding:13px 9px;border:1px solid #dce7dc;
      background:#f1f5f1;border-radius:8px;text-align:center
    }
    .status-message{margin-top:8px;font-size:13px;font-weight:800;line-height:1.55;color:#4c5a51}
    .steps{display:flex;gap:4px;overflow-x:auto;margin-top:11px}
    .step{
      flex:1;min-width:72px;padding:8px 4px;background:#e0e2df;
      color:#687069;border-radius:5px;font-size:11px;font-weight:900
    }
    .step.on{background:var(--deep);color:#fff}
    .line-result{
      margin-top:10px;padding:9px;border-radius:7px;font-size:12px;font-weight:800;
      background:#fff7e8;color:#755d2f;border:1px solid #e2d1a8
    }
    @media(min-width:760px){
      main{max-width:900px;margin:18px auto 0;background:#fff;border:1px solid #eee9df}
      .menu-grid{grid-template-columns:repeat(2,minmax(0,1fr));column-gap:30px}
      .sheet{max-width:760px;margin:auto}
      .bar{left:50%;right:auto;transform:translateX(-50%);width:min(840px,calc(100% - 22px));bottom:12px;border-radius:8px}
    }
  </style>
</head>
<body>
<header>
  <div class="info">
    <span>📍 新生南店｜臺北市新生南路一段14號之1</span>
    <span>☎ 訂購專線｜6609-5270</span>
    <span>🛵 外送｜滿200元</span>
  </div>
  <div class="brand-wrap">
    <div class="brand">一品現泡茶</div>
    <div class="brand-en">YI PIN TEA</div>
    <div class="slogan">杯杯現泡，新鮮看得見！！</div>
  </div>
  <div class="hero">
    <div><strong>一杯一泡，喝得到茶的本味</strong><br><small>700cc・甜度冰量自由選</small></div>
    <div><strong>金萱奶茶 × 南非國寶奶</strong></div>
  </div>
  <nav id="nav"></nav>
</header>

<main>
  <div id="menu"></div>
</main>

<div class="bar">
  <span>購物車 <b id="count">0</b> 杯｜$<b id="total">0</b></span>
  <button onclick="openCart()">查看購物車</button>
</div>

<div class="overlay" id="itemModal">
  <div class="sheet">
    <h2 id="title"></h2>
    <div id="price" style="margin-top:6px;color:#92763f;font-weight:900"></div>
    <div class="opt"><b>甜度</b><div class="choices" id="sweet"></div></div>
    <div class="opt"><b>冰量</b><div class="choices" id="ice"></div></div>
    <div class="opt"><b>加料</b><div class="choices" id="tops"></div></div>
    <div class="actions">
      <button class="secondary" onclick="closeM('itemModal')">取消</button>
      <button class="primary" onclick="addItem()">加入購物車</button>
    </div>
  </div>
</div>

<div class="overlay" id="cartModal">
  <div class="sheet">
    <h2>購物車</h2>
    <div id="cart"></div>
    <div class="total">合計 $<span id="cartTotal">0</span></div>
    <div class="actions">
      <button class="secondary" onclick="closeM('cartModal')">繼續選購</button>
      <button class="primary" onclick="checkout()">選擇取餐方式</button>
    </div>
  </div>
</div>

<div class="overlay" id="checkoutModal">
  <div class="sheet">
    <h2>確認訂單</h2>
    <div class="form">
      <div class="fulfillment">
        <label><input type="radio" name="method" value="自取" checked onchange="toggleMethod()">🏪 門市自取</label>
        <label><input type="radio" name="method" value="外送" onchange="toggleMethod()">🛵 外送到府</label>
      </div>
      <div id="deliveryHint" class="delivery-note hidden">外送訂單滿 $200，配送範圍與時間以店家確認為準。</div>
      <label>姓名<input id="name"></label>
      <label>電話<input id="phone"></label>
      <label id="timeLabel">自取時間<input id="time" type="datetime-local"></label>
      <label id="addressLabel" class="hidden">外送地址<input id="address" placeholder="請輸入完整地址（含樓層／公司名稱）"></label>
      <label>備註<textarea id="remark" rows="3" placeholder="例如：公司櫃台、到達請來電"></textarea></label>
    </div>
    <div class="total">訂單金額 $<span id="checkoutTotal">0</span></div>
    <div class="actions">
      <button class="secondary" onclick="closeM('checkoutModal')">返回</button>
      <button class="primary" onclick="submitOrder()">送出訂單</button>
    </div>
  </div>
</div>

<div class="overlay" id="successModal">
  <div class="sheet">
    <h2>訂單已送出！</h2>
    <div class="status">
      <b id="statusTitle">🔔 新訂單</b>
      <div id="statusId"></div>
      <div class="status-message" id="statusMessage">訂單已送達店家，等待店家接單。</div>
      <div class="steps">
        <div class="step on" id="snew">新訂單</div>
        <div class="step" id="saccepted">已接單</div>
        <div class="step" id="smaking">製作中</div>
        <div class="step" id="sdone">已完成</div>
      </div>
      <div class="line-result" id="lineResult">正在確認 LINE 回傳狀態…</div>
    </div>
    <div class="actions">
      <button class="primary" onclick="returnToLine()">完成訂單／回到 LINE</button>
    </div>
  </div>
</div>

<script src="/socket.io/socket.io.js"></script>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = "2011256472-3TidlkYv";
let liffReady = false;

const MENU = {
  "現泡茶":[
    ["一品冰茶（金萱）",40],["阿薩姆紅茶",35],["錫蘭紅茶",40],["伯爵紅茶",40],
    ["大吉嶺紅茶",40],["阿里山青茶",40],["茉莉綠茶",40],["烏龍綠茶",40],
    ["油切綠茶",40],["鐵觀音茶",40],["東方美人茶",40],["普洱茶",40],
    ["蕎麥茶",45],["桂花烏龍茶",45],["蜜桃烏龍茶",45]
  ],
  "奶茶":[
    ["一品二奶",60],["金萱奶茶",55],["茉香奶綠",55],["錫蘭奶茶",55],["伯爵奶茶",55],
    ["阿薩姆奶茶",55],["烏龍奶茶",55],["鐵觀音奶茶",55],["北海道奶茶",55],
    ["京都抹茶奶",65],["蜂蜜奶茶",65],["沖繩黑糖奶茶",65],["阿華田",55],
    ["可可亞",55],["杏仁奶茶",55],["黑豆玄米抹茶奶",65]
  ],
  "口感奶茶":[
    ["珍珠奶茶",55],["珍珠奶綠",55],["珍珠黑糖奶茶",65],["椰果奶茶",55],
    ["珍椰奶茶",55],["仙草凍奶茶",55],["杏仁凍奶綠",60],["統一布丁奶茶",65]
  ],
  "鮮奶（瑞穗鮮奶）":[
    ["鮮奶茶",65],["鮮奶綠",65],["烏龍鮮奶茶",65],["鐵觀音鮮奶茶",65],
    ["伯爵鮮奶茶",65],["抹茶鮮奶茶",75],["黑糖鮮奶茶",75],
    ["珍珠黑糖鮮奶",80],["仙草黑糖鮮奶",80]
  ],
  "檸檬":[
    ["檸檬汁",55],["檸檬話梅",55],["金桔檸檬",60],["檸檬梅汁",60],
    ["蜂蜜檸檬",65],["脆梅檸檬汁",65],["峇里島水果茶",60]
  ],
  "特調":[
    ["蜜茶",45],["仙草蜜茶",55],["蜂蜜蘆薈",55],["檸檬蘆薈",55],["冬瓜茶",40],
    ["冬瓜青茶",55],["冬瓜鐵觀音",55],["冬瓜檸檬",60],["蜂蜜綠茶",55],
    ["百香綠茶",55],["芒果綠茶",55],["梅果綠茶",55],["檸檬綠茶",55],
    ["脆脆青梅綠",65],["百香QQ",60]
  ],
  "養樂多":[["多多綠",65],["百香多多",60],["芒果多多",60],["檸檬多多",65]],
  "養生":[["桂圓紅棗茶",55],["黑糖薑母茶",55],["韓式柚子茶",60]],
  "無咖啡因茶":[["牛蒡茶",45],["南非國寶茶",50],["紅棗枸杞茶",45],["蔓越莓蘋果",45]]
};

const TOPS = [
  ["珍珠",10],["椰果",10],["蘆薈",10],["仙草凍",10],
  ["綠茶凍",15],["杏仁凍",15],["統一布丁",15],["奶茶",15],["鮮奶",25]
];
const SWEET = ["正常糖 80%","少糖 70%","半糖 50%","微糖 30%","點糖 10%","無糖 0%"];
const ICE = ["正常冰","少冰","微冰","去冰","常溫","溫","熱"];

let cart = [];
let current = null;
let trackingId = null;
let trackingTimer = null;

const nav = document.getElementById("nav");
const menuEl = document.getElementById("menu");

async function initLiff(){
  try{
    await liff.init({ liffId: LIFF_ID });
    liffReady = true;
  }catch(e){
    console.error("LIFF init failed", e);
  }
}

function formatLineOrderMessage(order,payload){
  const itemLines = payload.items.map((x,i)=>{
    const toppings = x.tops.length ? `｜加料：${x.tops.map(t=>t.name).join("、")}` : "";
    return `${i+1}. ${x.name} ×1｜${x.sweet}｜${x.ice}${toppings}`;
  });

  return [
    "🧋 一品現泡茶｜訂單成立",
    `訂單編號：${order.id}`,
    payload.method === "外送" ? "🛵 外送" : "🏪 門市自取",
    `姓名：${payload.name}`,
    `電話：${payload.phone}`,
    `時間：${payload.pickup}`,
    payload.method === "外送" && payload.address ? `地址：${payload.address}` : "",
    "",
    ...itemLines,
    "",
    `💰 總金額：$${payload.total}`,
    payload.remark ? `備註：${payload.remark}` : ""
  ].filter(Boolean).join("\n");
}

async function sendOrderBackToLine(order,payload){
  const result = document.getElementById("lineResult");

  try{
    if(!liffReady) await initLiff();

    if(!window.liff){
      result.textContent = "LINE SDK 尚未載入；訂單本身已成立。";
      return false;
    }

    if(!liff.isInClient()){
      result.textContent = "目前不是從 LINE App 內的 LIFF 開啟；訂單本身已成立。";
      return false;
    }

    if(!liff.isApiAvailable || !liff.isApiAvailable("sendMessages")){
      result.textContent = "目前 LINE 開啟方式不支援自動回傳訊息；訂單本身已成立。";
      return false;
    }

    await liff.sendMessages([{
      type:"text",
      text:formatLineOrderMessage(order,payload)
    }]);

    result.textContent = "✅ 訂單訊息已傳回目前的 LINE 聊天室。";
    return true;
  }catch(e){
    console.error("sendMessages failed", e);
    result.textContent = "LINE 回傳失敗，但訂單本身已成立。請保留訂單編號。";
    return false;
  }
}

Object.keys(MENU).forEach((cat,i)=>{
  const b = document.createElement("button");
  b.textContent = cat;
  b.onclick = ()=>show(cat,b);
  if(i===0) b.classList.add("active");
  nav.appendChild(b);
});
show(Object.keys(MENU)[0], nav.children[0]);

function show(cat,btn){
  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));
  btn.classList.add("active");

  const note = cat==="現泡茶"
    ? '<span class="section-note">所有純茶皆可升級為奶茶或鮮奶茶</span>'
    : "";

  menuEl.innerHTML = `
    <div class="section-head">
      <div class="section-title-wrap"><h2>${cat}</h2>${note}</div>
      <span>${MENU[cat].length} 款</span>
    </div>
    <div class="menu-grid">
      ${MENU[cat].map((x,i)=>`
        <div class="card">
          <div class="name">${x[0]}</div>
          <button class="add" type="button" data-cat="${encodeURIComponent(cat)}" data-index="${i}">＋</button>
          <div class="price">$${x[1]}</div>
        </div>
      `).join("")}
    </div>
  `;

  menuEl.querySelectorAll(".add").forEach(btn=>{
    btn.addEventListener("click",()=>{
      openItem(decodeURIComponent(btn.dataset.cat), Number(btn.dataset.index));
    });
  });
}

function openItem(cat,i){
  current = { name:MENU[cat][i][0], price:MENU[cat][i][1] };
  document.getElementById("title").textContent = current.name;
  document.getElementById("price").textContent = `$${current.price}｜700cc`;

  document.getElementById("sweet").innerHTML = SWEET.map((x,i)=>`
    <label><input type="radio" name="sweetOpt" value="${x}" ${i===0?"checked":""}>${x}</label>
  `).join("");

  document.getElementById("ice").innerHTML = ICE.map((x,i)=>`
    <label><input type="radio" name="iceOpt" value="${x}" ${i===0?"checked":""}>${x}</label>
  `).join("");

  document.getElementById("tops").innerHTML = TOPS.map(x=>`
    <label><input type="checkbox" value="${x[0]}" data-p="${x[1]}">${x[0]} +${x[1]}</label>
  `).join("");

  document.getElementById("itemModal").classList.add("show");
}

function closeM(id){
  document.getElementById(id).classList.remove("show");
}

function addItem(){
  const ts = [...document.querySelectorAll("#tops input:checked")]
    .map(x=>({name:x.value,p:Number(x.dataset.p)}));

  cart.push({
    ...current,
    sweet:document.querySelector('input[name="sweetOpt"]:checked').value,
    ice:document.querySelector('input[name="iceOpt"]:checked').value,
    tops:ts
  });

  closeM("itemModal");
  update();
}

function total(){
  return cart.reduce((sum,x)=>sum+x.price+x.tops.reduce((s,t)=>s+t.p,0),0);
}

function update(){
  document.getElementById("count").textContent = cart.length;
  document.getElementById("total").textContent = total();
}

function openCart(){
  renderCart();
  document.getElementById("cartModal").classList.add("show");
}

function renderCart(){
  document.getElementById("cart").innerHTML = cart.length
    ? cart.map((x,i)=>`
        <div class="item">
          <div>
            <b>${x.name}</b>
            <div class="sub">${x.sweet}｜${x.ice}${x.tops.length?"｜加料："+x.tops.map(t=>t.name).join("、"):""}</div>
          </div>
          <div style="text-align:right;font-weight:900">
            $${x.price+x.tops.reduce((a,t)=>a+t.p,0)}<br>
            <button onclick="del(${i})">刪除</button>
          </div>
        </div>
      `).join("")
    : '<div class="empty">購物車目前是空的</div>';

  document.getElementById("cartTotal").textContent = total();
}

function del(i){
  cart.splice(i,1);
  update();
  renderCart();
}

function checkout(){
  if(!cart.length) return alert("購物車是空的");
  closeM("cartModal");
  document.getElementById("checkoutTotal").textContent = total();
  toggleMethod();
  document.getElementById("checkoutModal").classList.add("show");
}

function toggleMethod(){
  const method = document.querySelector('input[name="method"]:checked')?.value || "自取";
  const delivery = method === "外送";
  document.getElementById("addressLabel").classList.toggle("hidden",!delivery);
  document.getElementById("deliveryHint").classList.toggle("hidden",!delivery);
  document.getElementById("timeLabel").childNodes[0].nodeValue = delivery ? "希望送達時間" : "自取時間";
}

async function submitOrder(){
  const method = document.querySelector('input[name="method"]:checked')?.value || "自取";
  const payload = {
    name:document.getElementById("name").value.trim(),
    phone:document.getElementById("phone").value.trim(),
    pickup:document.getElementById("time").value,
    address:document.getElementById("address").value.trim(),
    method,
    remark:document.getElementById("remark").value.trim(),
    items:cart,
    total:total()
  };

  if(!payload.name || !payload.phone || !payload.pickup){
    return alert("請完整填寫姓名、電話與時間");
  }
  if(method==="外送" && payload.total<200){
    return alert("外送訂單需滿 $200");
  }
  if(method==="外送" && !payload.address){
    return alert("請填寫完整外送地址");
  }

  let r;
  try{
    r = await fetch("/api/orders",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify(payload)
    });
  }catch(e){
    return alert("無法連線到訂單系統，請稍後再試");
  }

  if(!r.ok){
    let msg = "送單失敗，請再試一次";
    try{
      const e = await r.json();
      if(e.error) msg = e.error;
    }catch(_){}
    return alert(msg);
  }

  const order = await r.json();
  trackingId = order.id;

  document.getElementById("statusId").textContent = `訂單編號：${order.id}｜${order.method}`;
  renderStatus(order.status || "new");
  closeM("checkoutModal");
  document.getElementById("successModal").classList.add("show");

  await sendOrderBackToLine(order,payload);

  cart = [];
  update();
  startTracking(order.id);
}

if(typeof io === "function"){
  const socket = io();
  socket.on("order-updated",o=>{
    if(o.id===trackingId) renderStatus(o.status);
  });
}

function renderStatus(st){
  const map = {
    new:["🔔 新訂單","snew","訂單已送達店家，等待店家接單。"],
    accepted:["👋 店家已接單","saccepted","店家已確認您的訂單，準備開始製作。"],
    making:["🥤 製作中","smaking","您的飲品正在製作中，請稍候。"],
    done:["✅ 已完成","sdone","訂單已完成，自取請準備取餐；外送請留意店家聯繫。"],
    cancelled:["⚠️ 訂單已取消","snew","此訂單已取消，如有疑問請聯絡店家。"]
  };

  const [title,id,msg] = map[st] || map.new;
  document.getElementById("statusTitle").textContent = title;
  document.getElementById("statusMessage").textContent = msg;

  const ids = ["snew","saccepted","smaking","sdone"];
  const target = ids.indexOf(id);
  ids.forEach((x,i)=>{
    document.getElementById(x).classList.toggle("on", st!=="cancelled" && i<=target);
  });
}

function startTracking(id){
  if(trackingTimer) clearInterval(trackingTimer);

  const check = async()=>{
    try{
      const r = await fetch(`/api/orders/${encodeURIComponent(id)}`,{cache:"no-store"});
      if(!r.ok) return;
      const o = await r.json();
      if(o.id===trackingId){
        renderStatus(o.status);
        if(o.status==="done" || o.status==="cancelled"){
          clearInterval(trackingTimer);
          trackingTimer = null;
        }
      }
    }catch(_){}
  };

  check();
  trackingTimer = setInterval(check,2500);
}

async function returnToLine(){
  try{
    if(window.liff && liffReady && liff.isInClient()){
      liff.closeWindow();
      return;
    }
  }catch(_){}

  try{
    if(history.length>1){
      history.back();
      return;
    }
    window.close();
  }catch(_){}
}

initLiff();
</script>
</body>
</html>
