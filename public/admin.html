<!doctype html><html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>一品現泡茶｜店家後台</title><style>
body{margin:0;background:#f3f5f3;color:#263328;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",Arial,sans-serif}
header{background:#07502f;color:#fff;padding:18px 20px;display:flex;justify-content:space-between;align-items:center}main{max-width:1200px;margin:auto;padding:18px}.login{background:#fff;padding:20px;border-radius:16px;max-width:420px;margin:60px auto}.login input{width:100%;padding:12px;margin:10px 0;border:1px solid #ddd;border-radius:10px;box-sizing:border-box}.login button{width:100%;padding:12px;background:#07502f;color:#fff;border:0;border-radius:10px;font-weight:800}
.board{display:grid;grid-template-columns:repeat(4,1fr);gap:14px}.col{background:#e9ece9;border-radius:16px;padding:12px;min-height:400px}.col h2{font-size:16px}.card{background:#fff;border-radius:13px;padding:14px;margin:9px 0;box-shadow:0 2px 10px #0001}.id{font-weight:900;color:#07502f}.small{font-size:13px;color:#666;margin-top:4px}.items{font-size:13px;line-height:1.55;margin-top:10px}.money{text-align:right;font-size:18px;font-weight:900;margin-top:8px}.actions{display:flex;gap:6px;margin-top:10px}.actions button{border:0;border-radius:9px;padding:8px 10px;font-weight:800}.accept{background:#07502f;color:#fff}.making{background:#c98b1b;color:#fff}.done{background:#4d6f52;color:#fff}.cancel{background:#eee}.empty{color:#888;text-align:center;padding:30px 5px}@media(max-width:900px){.board{grid-template-columns:repeat(2,1fr)}}@media(max-width:560px){.board{grid-template-columns:1fr}}

/* ===== 後台手機版優化 ===== */
*{box-sizing:border-box}
html,body{max-width:100%;overflow-x:hidden}
header{position:sticky;top:0;z-index:20;gap:8px}
.toolbar{display:flex;gap:8px;align-items:center;margin-bottom:12px}
.refresh{border:0;border-radius:9px;padding:9px 12px;background:#fff;color:#07502f;font-weight:800}
@media(max-width:560px){
  header{padding:13px 12px;font-size:14px}
  main{padding:10px}
  .login{margin:30px auto;padding:16px}
  .board{grid-template-columns:1fr;gap:10px}
  .col{min-height:0;padding:10px;border-radius:12px}
  .col h2{position:sticky;top:48px;background:#e9ece9;padding:8px 2px;margin:0 0 6px;z-index:4}
  .card{padding:12px;border-radius:10px}
  .actions{display:grid;grid-template-columns:1fr 1fr}
  .actions button{min-height:42px}
}

</style></head><body>
<header><b>一品現泡茶｜新生南店 店家後台</b><span id="bell">🔕</span></header><main><div id="login" class="login"><h2>店家登入</h2><input id="pin" type="password" placeholder="請輸入後台 PIN"><button onclick="login()">登入</button></div>
<div id="app" style="display:none"><div class="toolbar"><button class="refresh" onclick="load()">↻ 重新整理訂單</button><span class="small">狀態每 3 秒自動同步</span></div><div class="board"><div class="col"><h2>🔔 新訂單 <span id="cnew">0</span></h2><div id="new"></div></div><div class="col"><h2>👋 已接單 <span id="caccepted">0</span></h2><div id="accepted"></div></div><div class="col"><h2>🥤 製作中 <span id="cmaking">0</span></h2><div id="making"></div></div><div class="col"><h2>✅ 已完成 <span id="cdone">0</span></h2><div id="done"></div></div></div></div></main>
<script src="/socket.io/socket.io.js"></script>
<script>
let logged=false;
async function login(){const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin:document.getElementById('pin').value})});const x=await r.json();if(!x.ok)return alert('PIN 錯誤');logged=true;document.getElementById('login').style.display='none';document.getElementById('app').style.display='block';load()}
async function load(){if(!logged)return;const r=await fetch('/api/admin/orders');render(await r.json())}
function render(all){['new','accepted','making','done'].forEach(s=>{let a=all.filter(o=>o.status===s);document.getElementById(s).innerHTML=a.length?a.map(card).join(''):'<div class="empty">目前沒有訂單</div>';document.getElementById('c'+s).textContent=a.length})}
function card(o){let items=o.items.map(x=>'<div class="items"><b>'+x.name+'</b> × 1<br>'+x.sweet+'｜'+x.ice+(x.tops?.length?'｜加料：'+x.tops.map(t=>t.name).join('、'):'')+'</div>').join('');let b='';if(o.status==='new')b='<button class="accept" onclick="move(\''+o.id+'\',\'accepted\')">接單</button><button class="cancel" onclick="move(\''+o.id+'\',\'cancelled\')">取消</button>';if(o.status==='accepted')b='<button class="making" onclick="move(\''+o.id+'\',\'making\')">開始製作</button>';if(o.status==='making')b='<button class="done" onclick="move(\''+o.id+'\',\'done\')">已完成</button>';const delivery=o.method==='外送';return '<div class="card"><div class="id">'+o.id+'｜'+(delivery?'🛵 外送':'🏪 自取')+'</div><div class="small">'+(delivery?'送達':'取餐')+'：'+new Date(o.pickup).toLocaleString('zh-TW')+'</div><div class="small">'+o.name+'｜'+o.phone+'</div>'+(delivery?'<div class="small"><b>地址：</b>'+((o.address||'未填'))+'</div>':'')+(o.remark?'<div class="small"><b>備註：</b>'+o.remark+'</div>':'')+items+'<div class="money">$'+o.total+'</div><div class="actions">'+b+'</div></div>'}

async function move(id,status){await fetch('/api/admin/orders/'+id+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});load()}
if (typeof io === 'function') {
 const socket=io();
 socket.on('new-order',o=>{document.getElementById('bell').textContent='🔔 新訂單';if(logged)load();});
 socket.on('order-updated',()=>{if(logged)load()});
}
setInterval(load,3000);
</script></body></html>
