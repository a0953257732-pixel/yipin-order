<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1" />
<title>一品現泡茶｜接單後台</title>
<script src="/socket.io/socket.io.js"></script>
<style>
:root{--bg:#f5f4ef;--card:#fff;--ink:#183028;--muted:#6e7a75;--line:#dedfd9;--green:#1f5b46;--green2:#e8f1ed;--orange:#a86014;--red:#a43a34;--shadow:0 8px 24px rgba(31,45,39,.08)}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans TC",sans-serif;background:var(--bg);color:var(--ink)}
button,input,select{font:inherit}.hidden{display:none!important}
.login{min-height:100vh;display:grid;place-items:center;padding:24px}.login-card{width:min(420px,100%);background:#fff;border:1px solid var(--line);border-radius:22px;padding:28px;box-shadow:var(--shadow)}
.logo{font:700 26px/1.2 Georgia,"Noto Serif TC",serif;margin-bottom:6px}.sub{color:var(--muted);font-size:14px}.login input{width:100%;margin:24px 0 12px;padding:14px 16px;border:1px solid #ccd2ce;border-radius:12px;font-size:18px}.primary{border:0;background:var(--green);color:#fff;border-radius:12px;padding:13px 18px;font-weight:700;cursor:pointer}.login .primary{width:100%}
header{position:sticky;top:0;z-index:10;background:rgba(245,244,239,.94);backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}.head{max-width:1280px;margin:auto;padding:14px 18px;display:flex;gap:16px;align-items:center;justify-content:space-between}.brand strong{font-size:20px}.brand small{display:block;color:var(--muted);margin-top:2px}.head-actions{display:flex;gap:8px}.ghost{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:10px;padding:9px 12px;cursor:pointer}
main{max-width:1280px;margin:0 auto;padding:20px 18px 80px}.stats{display:grid;grid-template-columns:repeat(5,1fr);gap:12px;margin-bottom:16px}.stat{background:#fff;border:1px solid var(--line);border-radius:16px;padding:14px 16px}.stat b{font-size:26px}.stat span{display:block;color:var(--muted);font-size:13px;margin-top:4px}
.tabs{display:flex;gap:8px;margin:16px 0}.tab{border:1px solid var(--line);background:#fff;border-radius:999px;padding:10px 16px;cursor:pointer;font-weight:700}.tab.active{background:var(--green);border-color:var(--green);color:#fff}.badge{display:inline-block;min-width:22px;padding:1px 6px;border-radius:999px;background:rgba(255,255,255,.18);font-size:12px;margin-left:6px}
.toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:14px}.toolbar input,.toolbar select{background:#fff;border:1px solid var(--line);border-radius:10px;padding:10px 12px}.toolbar input{min-width:260px;flex:1}.note{font-size:13px;color:var(--muted);margin:8px 0 14px}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.order{background:#fff;border:1px solid var(--line);border-radius:18px;padding:16px;box-shadow:0 3px 14px rgba(31,45,39,.04)}.order.new{border-left:5px solid #d69228}.order.accepted{border-left:5px solid #2f7b5d}.order.making{border-left:5px solid #5277a8}.order.done{border-left:5px solid #75817c;opacity:.96}.order.cancelled{border-left:5px solid #b24b44;opacity:.88}.top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.oid{font-weight:800;font-size:18px}.time{color:var(--muted);font-size:13px;margin-top:4px}.status{white-space:nowrap;border-radius:999px;padding:6px 10px;font-size:12px;font-weight:800}.status.new{background:#fff2dd;color:#8b550d}.status.accepted{background:#e6f3ed;color:#235d48}.status.making{background:#e9f0f8;color:#345b88}.status.done{background:#edf0ef;color:#52615b}.status.cancelled{background:#f8e8e7;color:#8d342f}
.customer{margin:14px 0 10px;padding:11px 12px;background:#f8f8f5;border-radius:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px 12px;font-size:14px}.customer b{font-weight:700}.items{border-top:1px dashed var(--line);border-bottom:1px dashed var(--line);padding:10px 0;margin:10px 0}.item{display:flex;justify-content:space-between;gap:12px;padding:5px 0;font-size:14px}.item small{color:var(--muted);display:block;margin-top:2px}.total{display:flex;justify-content:space-between;align-items:center;font-weight:800;font-size:18px;margin-top:10px}.remark{margin-top:8px;padding:9px 10px;background:#fff8e9;border-radius:10px;font-size:13px}.actions{display:flex;gap:7px;flex-wrap:wrap;margin-top:13px}.actions button{border:1px solid var(--line);background:#fff;border-radius:9px;padding:8px 10px;cursor:pointer}.actions button.on{background:var(--green2);border-color:#aac8bb;color:var(--green);font-weight:700}.actions .danger{color:var(--red)}
.empty{background:#fff;border:1px dashed #cfd5d1;border-radius:16px;padding:44px 20px;text-align:center;color:var(--muted);grid-column:1/-1}.error{color:#a43a34;margin-top:10px;font-size:14px}.history-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}.countline{color:var(--muted);font-size:13px}.system-banner{max-width:1280px;margin:12px auto 0;padding:12px 16px;border-radius:12px;font-weight:800}.system-banner.ok{background:#e7f3ed;color:#205c46;border:1px solid #b9d5c8}.system-banner.warn{background:#fff0df;color:#8a4d0b;border:1px solid #e7c18f}.sound-banner{background:#fff8df;border:1px solid #e5ce81;border-radius:12px;padding:12px 14px;margin-bottom:14px;display:flex;justify-content:space-between;align-items:center;gap:12px}.preorder-tag{display:inline-block;margin-left:7px;padding:2px 7px;border-radius:999px;background:#f2e8cf;color:#795b18;font-size:11px}
@media(max-width:850px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.head{align-items:flex-start}.customer{grid-template-columns:1fr}.toolbar input{min-width:100%}}
</style>
</head>
<body>
<section id="login" class="login">
  <div class="login-card">
    <div class="logo">一品現泡茶</div>
    <div class="sub">門市接單後台</div>
    <input id="pin" type="password" inputmode="numeric" placeholder="輸入管理 PIN" autocomplete="current-password" />
    <button class="primary" onclick="login()">登入後台</button>
    <div id="loginErr" class="error"></div>
  </div>
</section>

<div id="app" class="hidden">
<header><div class="head">
  <div class="brand"><strong>一品現泡茶｜接單後台</strong><small id="lastUpdate">—</small></div>
  <div class="head-actions"><button id="soundBtn" class="ghost" onclick="toggleSound()">🔔 鈴聲：開</button><button class="ghost" onclick="testSound()">測試鈴聲</button><button class="ghost" onclick="loadOrders()">重新整理</button><button class="ghost" onclick="logout()">登出</button></div>
</div></header>
<div id="storageBanner" class="system-banner warn">正在確認歷史訂單儲存狀態…</div>
<main>
  <div id="soundNotice" class="sound-banner"><span>🔔 請點一次啟用鈴聲；有未接新訂單時會每 15 秒提醒。</span><button class="primary" onclick="enableSound()">啟用並測試鈴聲</button></div>
  <section class="stats">
    <div class="stat"><b id="sNew">0</b><span>新訂單</span></div>
    <div class="stat"><b id="sPreorder">0</b><span>預訂單</span></div>
    <div class="stat"><b id="sDoing">0</b><span>處理中</span></div>
    <div class="stat"><b id="sDoneToday">0</b><span>今日已完成</span></div>
    <div class="stat"><b id="sTodaySales">$0</b><span>今日訂單金額</span></div>
  </section>

  <div class="tabs">
    <button id="tabActive" class="tab active" onclick="setTab('active')">進行中 <span id="activeBadge" class="badge">0</span></button>
    <button id="tabPreorder" class="tab" onclick="setTab('preorder')">預訂單 <span id="preorderBadge" class="badge">0</span></button>
    <button id="tabHistory" class="tab" onclick="setTab('history')">歷史訂單 <span id="historyBadge" class="badge">0</span></button>
  </div>

  <section id="activePanel">
    <div class="note">新訂單、已接單與製作中的訂單會留在這裡；按「完成」後會移到歷史訂單，不會直接消失。</div>
    <div id="activeGrid" class="grid"></div>
  </section>

  <section id="preorderPanel" class="hidden">
    <div class="note">預約明天、後天或更晚日期取餐的訂單會列在這裡；到了取餐當天會自動移到進行中。</div>
    <div id="preorderGrid" class="grid"></div>
  </section>

  <section id="historyPanel" class="hidden">
    <div class="history-head">
      <div class="toolbar" style="flex:1">
        <input id="q" placeholder="搜尋訂單編號、姓名、電話" oninput="renderHistory()" />
        <select id="range" onchange="renderHistory()">
          <option value="7">最近 7 天</option>
          <option value="30" selected>最近 30 天</option>
          <option value="90">最近 90 天</option>
          <option value="all">全部</option>
        </select>
        <select id="hstatus" onchange="renderHistory()">
          <option value="all">完成＋取消</option>
          <option value="done">只看完成</option>
          <option value="cancelled">只看取消</option>
        </select>
      </div>
      <div id="historyCount" class="countline"></div>
    </div>
    <div class="note">歷史訂單預設顯示最近 30 天；你也可以切換成 90 天或全部。</div>
    <div id="historyGrid" class="grid"></div>
  </section>
</main>
</div>
<script>
let orders=[];
let currentTab='active';
let soundEnabled=localStorage.getItem('yipin_sound_enabled')!=='0';
let audioCtx=null;
let initialOrdersLoaded=false;
let knownOrderIds=new Set();
let alarmTimer=null;
const STATUS_LABEL={new:'🔔 新訂單',accepted:'✅ 已接單',making:'🥤 製作中',done:'✔ 已完成',cancelled:'✕ 已取消'};
function ensureAudio(){
  try{
    const AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return null;
    if(!audioCtx)audioCtx=new AC();
    if(audioCtx.state==='suspended')audioCtx.resume();
    return audioCtx;
  }catch(e){return null}
}
function playAlarm(){
  if(!soundEnabled)return;
  const ctx=ensureAudio();
  if(!ctx)return;
  const now=ctx.currentTime;
  const notes=[880,1174,880,1174,880,1174];
  notes.forEach((freq,i)=>{
    const o=ctx.createOscillator(),g=ctx.createGain();
    o.type='sine';o.frequency.value=freq;
    const st=now+i*0.22;
    g.gain.setValueAtTime(0.0001,st);
    g.gain.exponentialRampToValueAtTime(0.28,st+0.015);
    g.gain.exponentialRampToValueAtTime(0.0001,st+0.16);
    o.connect(g);g.connect(ctx.destination);o.start(st);o.stop(st+0.18);
  });
}
function updateSoundBtn(){const b=document.getElementById('soundBtn');if(b)b.textContent=soundEnabled?'🔔 鈴聲：開':'🔕 鈴聲：關'}
function toggleSound(){soundEnabled=!soundEnabled;localStorage.setItem('yipin_sound_enabled',soundEnabled?'1':'0');ensureAudio();updateSoundBtn();if(soundEnabled)playAlarm();syncAlarmLoop()}
function testSound(){ensureAudio();playAlarm()}
function enableSound(){soundEnabled=true;localStorage.setItem('yipin_sound_enabled','1');ensureAudio();updateSoundBtn();playAlarm();document.getElementById('soundNotice')?.classList.add('hidden');syncAlarmLoop()}
function pickupTime(o){const t=new Date(o?.pickup||'').getTime();return Number.isFinite(t)?t:0}
function startOfTomorrow(){const d=new Date();d.setHours(24,0,0,0);return d.getTime()}
function isPreorder(o){return ['new','accepted'].includes(o.status)&&pickupTime(o)>=startOfTomorrow()}
function syncAlarmLoop(){const hasNew=orders.some(o=>o.status==='new');if(hasNew&&soundEnabled&&!alarmTimer)alarmTimer=setInterval(playAlarm,15000);if((!hasNew||!soundEnabled)&&alarmTimer){clearInterval(alarmTimer);alarmTimer=null}}
async function loadSystemStatus(){try{const r=await fetch('/api/health',{cache:'no-store'}),d=await r.json();const b=document.getElementById('storageBanner');if(d.persistentStorage){b.className='system-banner ok';b.textContent='✅ 永久資料庫已啟用：Render 重啟或重新部署後，歷史訂單仍會保留。'}else{b.className='system-banner warn';b.textContent='⚠️ 尚未啟用永久資料庫：目前訂單可能在 Render 重啟後消失。請設定 DATABASE_URL。'}}catch(e){}}
function esc(v){return String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
function localDate(v){if(!v)return '-';const d=new Date(v);if(Number.isNaN(d.getTime()))return esc(v);return d.toLocaleString('zh-TW',{hour12:false,month:'2-digit',day:'2-digit',hour:'2-digit',minute:'2-digit'})}
function isToday(v){const d=new Date(v),n=new Date();return d.getFullYear()===n.getFullYear()&&d.getMonth()===n.getMonth()&&d.getDate()===n.getDate()}
function itemPrice(x){return Number(x?.price||0)+(Array.isArray(x?.tops)?x.tops.reduce((a,t)=>a+Number(t?.p||0),0):0)}
function itemDetail(x){const a=[];if(x.sweet||x.sugar)a.push(x.sweet||x.sugar);if(x.ice)a.push(x.ice);const tops=(x.tops||x.addons||[]).map(t=>typeof t==='string'?t:t.name).filter(Boolean);if(tops.length)a.push('加料：'+tops.join('、'));return a.join('｜')}
async function login(){
 const pin=document.getElementById('pin').value.trim();document.getElementById('loginErr').textContent='';
 try{const r=await fetch('/api/admin/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({pin})});const d=await r.json();if(!d.ok){document.getElementById('loginErr').textContent='PIN 錯誤';return}sessionStorage.setItem('yipin_admin_ok','1');ensureAudio();showApp()}catch(e){document.getElementById('loginErr').textContent='無法連線後台'}
}
async function logout(){try{await fetch('/api/admin/logout',{method:'POST'})}catch(e){}sessionStorage.removeItem('yipin_admin_ok');location.reload()}
function showApp(){document.getElementById('login').classList.add('hidden');document.getElementById('app').classList.remove('hidden');ensureAudio();updateSoundBtn();loadSystemStatus();loadOrders()}
async function loadOrders(){
 try{
  const r=await fetch('/api/admin/orders',{cache:'no-store'});if(!r.ok)throw new Error();
  const fresh=await r.json();orders=Array.isArray(fresh)?fresh:[];
  const ids=new Set(orders.map(o=>o.id));
  if(initialOrdersLoaded){
    const hasNew=orders.some(o=>o.status==='new'&&!knownOrderIds.has(o.id));
    if(hasNew)playAlarm();
  }
  knownOrderIds=ids;initialOrdersLoaded=true;
  renderAll();syncAlarmLoop();document.getElementById('lastUpdate').textContent='最後更新 '+new Date().toLocaleTimeString('zh-TW',{hour12:false})
 }catch(e){document.getElementById('lastUpdate').textContent='讀取訂單失敗'}
}
function setTab(tab){currentTab=tab;document.getElementById('tabActive').classList.toggle('active',tab==='active');document.getElementById('tabPreorder').classList.toggle('active',tab==='preorder');document.getElementById('tabHistory').classList.toggle('active',tab==='history');document.getElementById('activePanel').classList.toggle('hidden',tab!=='active');document.getElementById('preorderPanel').classList.toggle('hidden',tab!=='preorder');document.getElementById('historyPanel').classList.toggle('hidden',tab!=='history');if(tab==='preorder')renderPreorders();if(tab==='history')renderHistory()}
function renderAll(){
 const preorder=orders.filter(isPreorder);
 const active=orders.filter(o=>['new','accepted','making'].includes(o.status)&&!isPreorder(o));
 const hist=orders.filter(o=>['done','cancelled'].includes(o.status));
 document.getElementById('sNew').textContent=active.filter(o=>o.status==='new').length;
 document.getElementById('sPreorder').textContent=preorder.length;
 document.getElementById('sDoing').textContent=active.filter(o=>o.status!=='new').length;
 document.getElementById('sDoneToday').textContent=orders.filter(o=>o.status==='done'&&isToday(o.updatedAt||o.createdAt)).length;
 document.getElementById('sTodaySales').textContent='$'+orders.filter(o=>isToday(o.createdAt)&&o.status!=='cancelled').reduce((a,o)=>a+Number(o.total||0),0).toLocaleString('zh-TW');
 document.getElementById('activeBadge').textContent=active.length;document.getElementById('preorderBadge').textContent=preorder.length;document.getElementById('historyBadge').textContent=hist.length;
 renderActive();renderPreorders();renderHistory();syncAlarmLoop();
}
function card(o,history=false){
 const items=(o.items||[]).map((x,i)=>`<div class="item"><div><b>${i+1}. ${esc(x.name||x.title||'品項')}</b><small>${esc(itemDetail(x))}</small></div><div>$${itemPrice(x)}</div></div>`).join('');
 const actions=history?`<div class="actions"><button onclick="changeStatus('${esc(o.id)}','accepted')">恢復為已接單</button></div>`:`<div class="actions">
 <button class="${o.status==='accepted'?'on':''}" onclick="changeStatus('${esc(o.id)}','accepted')">已接單</button>
 <button class="${o.status==='making'?'on':''}" onclick="changeStatus('${esc(o.id)}','making')">製作中</button>
 <button onclick="changeStatus('${esc(o.id)}','done')">完成</button>
 <button class="danger" onclick="changeStatus('${esc(o.id)}','cancelled')">取消</button></div>`;
 return `<article class="order ${esc(o.status)}"><div class="top"><div><div class="oid">${esc(o.id)}${isPreorder(o)?'<span class="preorder-tag">預訂</span>':''}</div><div class="time">下單 ${localDate(o.createdAt)}${o.updatedAt?'｜更新 '+localDate(o.updatedAt):''}</div></div><span class="status ${esc(o.status)}">${STATUS_LABEL[o.status]||esc(o.status)}</span></div>
 <div class="customer"><div><b>${esc(o.name||'-')}</b>｜${esc(o.phone||'-')}</div><div>${esc(o.method||'自取')}｜${esc(o.pickup||'-')}</div>${o.address?`<div style="grid-column:1/-1">地址：${esc(o.address)}</div>`:''}</div>
 <div class="items">${items||'<div class="sub">無品項資料</div>'}</div>
 <div class="total"><span>合計</span><span>$${Number(o.total||0).toLocaleString('zh-TW')}</span></div>${o.remark?`<div class="remark">備註：${esc(o.remark)}</div>`:''}${actions}</article>`
}
function renderActive(){const list=orders.filter(o=>['new','accepted','making'].includes(o.status)&&!isPreorder(o));document.getElementById('activeGrid').innerHTML=list.length?list.map(o=>card(o,false)).join(''):'<div class="empty">目前沒有進行中的訂單</div>'}
function renderPreorders(){const list=orders.filter(isPreorder).sort((a,b)=>pickupTime(a)-pickupTime(b));document.getElementById('preorderGrid').innerHTML=list.length?list.map(o=>card(o,false)).join(''):'<div class="empty">目前沒有預訂單</div>'}
function renderHistory(){
 const q=(document.getElementById('q')?.value||'').trim().toLowerCase(),range=document.getElementById('range')?.value||'30',st=document.getElementById('hstatus')?.value||'all';
 let list=orders.filter(o=>['done','cancelled'].includes(o.status));
 if(st!=='all')list=list.filter(o=>o.status===st);
 if(range!=='all'){const since=Date.now()-Number(range)*86400000;list=list.filter(o=>new Date(o.updatedAt||o.createdAt).getTime()>=since)}
 if(q)list=list.filter(o=>[o.id,o.name,o.phone,o.address].some(v=>String(v||'').toLowerCase().includes(q)));
 list.sort((a,b)=>new Date(b.updatedAt||b.createdAt)-new Date(a.updatedAt||a.createdAt));
 const c=document.getElementById('historyCount');if(c)c.textContent=`共 ${list.length} 筆`;
 const g=document.getElementById('historyGrid');if(g)g.innerHTML=list.length?list.map(o=>card(o,true)).join(''):'<div class="empty">這個條件下沒有歷史訂單</div>';
}
async function changeStatus(id,status){
 if(status==='cancelled'&&!confirm('確定要取消這張訂單？'))return;
 try{const r=await fetch('/api/admin/orders/'+encodeURIComponent(id)+'/status',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({status})});if(!r.ok){const d=await r.json().catch(()=>({}));throw new Error(d.error||'更新失敗')}const updated=await r.json();const i=orders.findIndex(o=>o.id===id);if(i>=0)orders[i]=updated;renderAll();if(['done','cancelled'].includes(status)){setTab('history')} }catch(e){alert(e.message||'更新失敗')}
}
async function restoreAdminLogin(){
 try{
  const r=await fetch('/api/admin/session',{cache:'no-store'}),d=await r.json();
  if(d.ok){sessionStorage.setItem('yipin_admin_ok','1');showApp();return}
 }catch(e){}
 sessionStorage.removeItem('yipin_admin_ok');
 document.getElementById('pin').addEventListener('keydown',e=>{if(e.key==='Enter')login()});
}
restoreAdminLogin();
try{const socket=io();socket.on('new-order',o=>{const isReallyNew=!knownOrderIds.has(o.id);knownOrderIds.add(o.id);orders=[o,...orders.filter(x=>x.id!==o.id)];renderAll();if(isReallyNew)playAlarm()});socket.on('order-updated',o=>{knownOrderIds.add(o.id);const i=orders.findIndex(x=>x.id===o.id);if(i>=0)orders[i]=o;else orders.unshift(o);renderAll()})}catch(e){}
setInterval(()=>{if(!document.getElementById('app').classList.contains('hidden'))loadOrders()},30000);
setInterval(()=>{if(!document.getElementById('app').classList.contains('hidden'))renderAll()},60000);
</script>
</body>
</html>
