<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一品現泡茶｜回傳訂單</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans TC","Microsoft JhengHei",sans-serif;margin:0;background:#f6f0e3;color:#123f2d;display:grid;place-items:center;min-height:100vh}
.box{width:min(420px,calc(100% - 32px));background:#fffdf8;border:1px solid #e4ded1;padding:28px 20px;text-align:center;box-shadow:0 12px 34px rgba(18,63,45,.10)}
h2{margin:0 0 12px}#msg{line-height:1.8;color:#59665e}button{border:0;background:#123f2d;color:white;padding:12px 18px;font-weight:800;margin-top:14px}
</style>
</head>
<body><div class="box"><h2>一品現泡茶</h2><div id="msg">正在把訂單回傳到 LINE 聊天室…</div><button id="retry" hidden>重新傳送</button></div>
<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const SEND_LIFF_ID="2011256472-Tj0ebhYR";
const msg=document.getElementById("msg");
const retry=document.getElementById("retry");

function getPayload(){
  const token=new URLSearchParams(location.search).get("token")||"";
  if(!token) throw new Error("缺少訂單回傳識別碼");
  const key="yipinLineSend:"+token;
  const raw=sessionStorage.getItem(key);
  if(!raw) throw new Error("找不到訂單資料，請回點餐頁重新送出");
  const data=JSON.parse(raw);
  if(!data?.text) throw new Error("訂單內容不完整");
  return {key,data};
}

async function send(){
  retry.hidden=true;
  msg.textContent="正在把訂單回傳到 LINE 聊天室…";
  try{
    const p=getPayload();
    await liff.init({liffId:SEND_LIFF_ID});
    if(!liff.isLoggedIn()){
      liff.login({redirectUri:location.href});
      return;
    }
    if(!liff.isInClient()) throw new Error("請從 LINE App 內完成訂單回傳");
    await liff.sendMessages([{type:"text",text:p.data.text.slice(0,4500)}]);
    sessionStorage.removeItem(p.key);
    msg.textContent="✅ 訂單已回傳到 LINE 聊天室";
    setTimeout(()=>{ try{liff.closeWindow();}catch(e){} },700);
  }catch(e){
    console.error(e);
    msg.textContent="⚠️ "+(e?.message||"LINE 訂單回傳失敗");
    retry.hidden=false;
  }
}
retry.onclick=send;
send();
</script></body></html>
