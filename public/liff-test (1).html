<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>一品現泡茶｜LIFF 測試</title>
<style>
body{font-family:-apple-system,BlinkMacSystemFont,"PingFang TC","Microsoft JhengHei",sans-serif;background:#f6f0e3;color:#123f2d;margin:0;padding:40px 20px}
.box{max-width:520px;margin:auto;background:#fffdf8;border:1px solid #ddd3c1;border-radius:14px;padding:28px;box-shadow:0 8px 28px rgba(0,0,0,.08)}
h1{font-size:24px;margin-top:0}.status{padding:16px;border-radius:10px;background:#eef3ef;font-weight:700;line-height:1.7}
pre{white-space:pre-wrap;word-break:break-all;font-size:12px;background:#f5f5f5;padding:12px;border-radius:8px;margin-top:16px}
</style>
</head>
<body>
<div class="box">
<h1>一品現泡茶｜LIFF 測試</h1>
<div id="status" class="status">正在初始化 LIFF…</div>
<pre id="diag"></pre>
</div>

<script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
<script>
const LIFF_ID = "2011256472-Tj0ebhYR";

async function start(){
  const status=document.getElementById("status");
  const diag=document.getElementById("diag");
  try{
    if(!window.liff) throw new Error("LIFF SDK 未載入");
    await liff.init({liffId:LIFF_ID});
    status.textContent="✅ LIFF 初始化成功";
    diag.textContent=[
      "LIFF ID: "+LIFF_ID,
      "isInClient: "+liff.isInClient(),
      "isLoggedIn: "+liff.isLoggedIn(),
      "OS: "+liff.getOS(),
      "LINE version: "+(liff.getLineVersion() || "unknown")
    ].join("\n");
  }catch(e){
    status.textContent="❌ LIFF 初始化失敗";
    diag.textContent="錯誤：" + (e && (e.code || e.message) ? (e.code || e.message) : String(e));
  }
}
start();
</script>
</body>
</html>
